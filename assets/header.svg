<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mahyar — Python developer. I build Telegram bots, mobile apps and web projects, and do SEO.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1f"/>
      <stop offset="1" stop-color="#140a26"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="320" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
    .orb3 { animation: drift3 16s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(140px, 60px); } }
    @keyframes drift2 { to { transform: translate(-160px, -40px); } }
    @keyframes drift3 { to { transform: translate(-80px, 70px); } }

    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .hi    { font-size: 26px; fill: #94a3b8; font-weight: 500; }
    .name  { font-size: 84px; font-weight: 800; letter-spacing: -2px; }
    .role  { font-size: 30px; fill: #e2e8f0; font-weight: 600; opacity: 0;
             animation: role 15s infinite both; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    .r4 { animation-delay: 9s; }
    .r5 { animation-delay: 12s; }
    @keyframes role {
      0%   { opacity: 0; transform: translateY(12px); }
      3%   { opacity: 1; transform: translateY(0); }
      17%  { opacity: 1; transform: translateY(0); }
      20%  { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .r1 { opacity: 1; }
    }
    .prompt { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 30px; fill: #a78bfa; font-weight: 600; }
    .cursor { fill: #22d3ee; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .tag  { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 18px; fill: #64748b; }
    .ring { animation: spin 30s linear infinite; transform-origin: 1010px 160px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.55">
      <circle class="orb1" cx="180" cy="40" r="140" fill="#7c3aed"/>
      <circle class="orb2" cx="1050" cy="260" r="160" fill="#2563eb"/>
      <circle class="orb3" cx="760" cy="20" r="110" fill="#0891b2"/>
    </g>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- right side: code-ish badge -->
    <g class="ring" opacity="0.5">
      <circle cx="1010" cy="160" r="105" fill="none" stroke="url(#name)" stroke-width="2" stroke-dasharray="6 14"/>
    </g>
    <circle cx="1010" cy="160" r="78" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="1010" y="178" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="url(#name)">&lt;/&gt;</text>

    <!-- left side: text -->
    <text class="hi" x="80" y="92">Hi there 👋 I'm</text>
    <text class="name" x="76" y="178" fill="url(#name)">Mahyar</text>

    <text class="prompt" x="80" y="240">&gt;</text>
    <text class="role r1" x="112" y="240">Python developer</text>
    <text class="role r2" x="112" y="240">I build Telegram bots</text>
    <text class="role r3" x="112" y="240">I build iOS &amp; Android apps</text>
    <text class="role r4" x="112" y="240">I build web shops &amp; sites</text>
    <text class="role r5" x="112" y="240">I grow websites with SEO</text>

    <text class="tag" x="80" y="286">📍 Tehran  ·  on my way to AI engineering</text>
    <rect class="cursor" x="520" y="270" width="12" height="20" rx="2"/>
  </g>
</svg>
